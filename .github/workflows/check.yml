name: Java correctness checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  correctness:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run correctness checks on Linux
        if: runner.os != 'Windows'
        run: sh run.sh test
      - name: Run correctness checks on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: run.cmd test
      - name: Preserve test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: correctness-${{ matrix.os }}
          path: results/test-output.txt
